kind = "web"
previewPath = "/"
title = "HIPZ — Dima S7ab"
description = "A bilingual French and Arabic brand website for HIPZ fruit drinks, showcasing the Lemon and Peach flavors, campaign imagery, and brand identity."
version = "1.0.0"
id = "artifacts/hipz-brand-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21374

[services.development]
run = "pnpm --filter @workspace/hipz-brand-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hipz-brand-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/hipz-brand-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21374"
BASE_PATH = "/"
